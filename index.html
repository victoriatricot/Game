<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bataille Navale — Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Bataille Navale — Prototype</h1>
    <div class="switch-row">
      <span class="switch-row__label">Joueurs :</span>
      <div id="player-count-switch" class="count-switch"></div>
    </div>
    <div class="switch-row">
      <span class="switch-row__label">Vue :</span>
      <div id="view-switch" class="view-switch"></div>
    </div>
  </header>

  <div id="turn-bar" class="turn-bar">
    <div class="turn-bar__status">
      <span id="turn-counter" class="turn-counter">Tour 1</span>
      <span id="selection-info" class="selection-info"></span>
    </div>
    <div class="turn-bar__actions">
      <button id="btn-move" class="mode-btn" hidden>Déplacer</button>
      <button id="btn-attack" class="mode-btn" hidden>Attaquer</button>
      <button id="btn-cancel" class="mode-btn" hidden>Désélectionner</button>
      <button id="btn-end-turn" class="end-turn-btn">Fin du tour</button>
    </div>
  </div>

  <main class="board-wrap">
    <div id="board" class="board" role="grid" aria-label="Plateau de jeu"></div>
  </main>

  <footer class="legend">
    <div class="legend__item"><span class="swatch swatch--ocean"></span> Océan</div>
    <div id="legend-players" class="legend__players"></div>
    <div class="legend__item"><span class="swatch swatch--fog"></span> Brouillard de guerre</div>
  </footer>
  <footer class="legend legend--ships">
    <span class="legend__label">Navires :</span>
    <span class="legend__item">PA porte-avions</span>
    <span class="legend__item">CU cuirassé</span>
    <span class="legend__item">CR croiseur</span>
    <span class="legend__item">SM sous-marin (furtif, liseré pointillé)</span>
    <span class="legend__item">DE destroyer</span>
  </footer>

  <script src="ships-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
